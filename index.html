<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mustafa Finance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b14;--s1:#0f1623;--s2:#161f30;--s3:#1c2840;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --accent:#22d3a5;--blue:#3b82f6;--yellow:#f59e0b;--red:#ef4444;--green:#22c55e;
  --text:#f1f5f9;--muted:#64748b;--muted2:#94a3b8;
}
body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
input,select,button{font-family:inherit}

/* LOADING */
#loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--s3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* AUTH */
#authScreen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(34,211,165,0.07) 0%,transparent 60%)}
.auth-box{background:var(--s1);border:1px solid var(--border2);border-radius:20px;padding:38px 32px;width:100%;max-width:400px}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo .logo-ico{font-size:38px;margin-bottom:8px}
.auth-logo h1{font-size:20px;font-weight:700;color:var(--accent)}
.auth-logo p{font-size:12px;color:var(--muted2);margin-top:4px}
.auth-tabs{display:flex;background:var(--s2);border-radius:10px;padding:4px;margin-bottom:22px;gap:4px}
.auth-tab{flex:1;padding:9px;border-radius:7px;border:none;background:transparent;color:var(--muted2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.auth-tab.act{background:var(--s3);color:var(--text);border:1px solid var(--border2)}
.auth-field{margin-bottom:13px}
.auth-field label{font-size:11px;color:var(--muted2);display:block;margin-bottom:5px}
.auth-in{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;direction:ltr}
.auth-in:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#22d3a5,#1aa880);color:#000;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:all .2s}
.auth-btn:hover{opacity:.9;transform:translateY(-1px)}
.auth-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--red);margin-bottom:11px;display:none}
.auth-note{display:flex;align-items:center;gap:6px;background:rgba(34,211,165,.05);border-radius:8px;padding:9px 12px;margin-top:14px}
.auth-note span{font-size:11px;color:var(--muted)}

/* APP */
#appScreen{display:none}
.topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.brand{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap}
.tb-sel{background:var(--s2);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:7px 10px;font-size:13px;outline:none;cursor:pointer;min-width:130px;flex:1}
.tb-in{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:13px;outline:none;width:130px}
.tb-in:focus{border-color:var(--accent)}
.bxs{padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.bg{background:rgba(34,211,165,.15);color:var(--accent);border:1px solid rgba(34,211,165,.3)}
.bg:hover{background:rgba(34,211,165,.28)}
.br{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.br:hover{background:rgba(239,68,68,.25)}
.blang{background:var(--s3);color:var(--muted2);border:1px solid var(--border2);padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.blang:hover{color:var(--text);border-color:var(--accent)}
.bout{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.bout:hover{background:rgba(239,68,68,.22)}
.u-bar{display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12px;color:var(--muted2)}
.u-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#000;flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .3s;flex-shrink:0}
.sdot.on{opacity:1}

/* MAIN */
.main{padding:16px;max-width:960px;margin:0 auto}
.card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:17px;margin-bottom:13px;animation:fu .3s ease both}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.stit{font-size:10px;font-weight:600;letter-spacing:.9px;color:var(--muted);margin-bottom:13px;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.sbar{width:3px;height:12px;border-radius:2px;display:inline-block;flex-shrink:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}

/* HERO */
.hero{background:linear-gradient(135deg,rgba(34,211,165,.09),rgba(59,130,246,.06));border:1px solid rgba(34,211,165,.17);border-radius:14px;padding:18px;margin-bottom:13px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;animation:fu .25s ease both}
.hi{text-align:center}
.hn{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;line-height:1;margin-bottom:3px}
.hl{font-size:10px;color:var(--muted2)}

/* INPUTS */
.ef{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;outline:none;transition:border-color .2s;direction:ltr;text-align:center}
.ef:focus{border-color:var(--accent)}
.efn{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif!important;direction:rtl;text-align:right;font-size:13px;font-weight:500}
.efsm{width:88px;font-size:13px}

/* GOAL */
.gg{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:9px;align-items:center;margin-bottom:13px}
.gl{font-size:12px;color:var(--muted2);white-space:nowrap}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.rb{background:var(--s2);border-radius:9px;padding:11px;text-align:center}
.rn{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;line-height:1;margin-bottom:3px}
.ru{font-size:10px;color:var(--muted)}

/* STATUS */
.st{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:11px;justify-content:center}
.sf{background:rgba(34,211,165,.1);color:var(--accent);border:1px solid rgba(34,211,165,.2)}
.sm{background:rgba(245,158,11,.1);color:var(--yellow);border:1px solid rgba(245,158,11,.2)}
.ss{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.sd{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.spl{background:linear-gradient(135deg,rgba(34,211,165,.07),rgba(59,130,246,.04));border:1px solid rgba(34,211,165,.14);border-radius:9px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}

/* ANN */
.ar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
.ab{background:var(--s2);border-radius:8px;padding:10px;text-align:center}
.an{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.al{font-size:10px;color:var(--muted);margin-top:2px}

/* PROG */
.pg{margin:7px 0}
.pt{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px}
.pk{height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .5s}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;color:var(--muted);padding:0 7px 9px;text-align:right;border-bottom:1px solid var(--border);letter-spacing:.5px}
.tbl td{padding:7px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.sw{display:flex;align-items:center;gap:6px}
.sib{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:13px;cursor:pointer;transition:all .15s}
.sib:hover{border-color:var(--accent)}

/* TOGGLE */
.tgl{position:relative;width:42px;height:23px;flex-shrink:0;display:block}
.tgl input{opacity:0;position:absolute;width:100%;height:100%;cursor:pointer;margin:0;z-index:2}
.tsl{position:absolute;inset:0;background:var(--s3);border:1px solid var(--border);border-radius:12px;pointer-events:none;transition:.2s}
.tsl::before{content:'';position:absolute;width:17px;height:17px;right:3px;top:2px;background:var(--muted);border-radius:50%;transition:.25s cubic-bezier(.4,0,.2,1)}
.tgl input:checked~.tsl{background:rgba(34,211,165,.2);border-color:var(--accent)}
.tgl input:checked~.tsl::before{transform:translateX(-19px);background:var(--accent)}

/* TOTALS */
.tot{background:var(--s2);border-radius:9px;padding:11px 14px;margin-top:11px}
.tr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
.tl{color:var(--muted2)}
.tv{font-family:'JetBrains Mono',monospace;font-weight:600}
.trn{border-top:1px solid var(--border);margin-top:7px;padding-top:9px}
.trn .tv{color:var(--accent);font-size:17px}

/* ADD SOURCE */
.asb{display:grid;grid-template-columns:auto 1fr 80px auto auto;gap:7px;align-items:center;padding:9px;background:var(--s2);border-radius:9px;margin-top:11px}

/* LOG */
.lib{display:grid;grid-template-columns:1fr 95px 105px auto;gap:7px;align-items:center;margin-bottom:11px}
.li{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:13px;outline:none;width:100%}
.li:focus{border-color:var(--accent)}
.la{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;outline:none;text-align:center;direction:ltr;width:100%}
.la:focus{border-color:var(--accent)}
.ltp{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px;outline:none;cursor:pointer}
.badd{background:rgba(34,211,165,.15);color:var(--accent);border:1px solid rgba(34,211,165,.3);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.badd:hover{background:rgba(34,211,165,.28)}
.baddr{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.baddr:hover{background:rgba(239,68,68,.25)}
.ll{max-height:190px;overflow-y:auto}
.li-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--border);font-size:12px}
.li-row:last-child{border-bottom:none}
.ld{flex:1;color:var(--muted2)}
.ltag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
.tg{background:rgba(34,211,165,.12);color:var(--accent)}
.tl2{background:rgba(239,68,68,.12);color:var(--red)}
.to{background:rgba(100,116,139,.15);color:var(--muted2)}
.te{background:rgba(245,158,11,.12);color:var(--yellow)}
.lv{font-family:'JetBrains Mono',monospace;font-weight:600;white-space:nowrap}
.ldt{color:var(--muted);font-size:10px;white-space:nowrap}
.bdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:1px 4px;transition:color .15s;flex-shrink:0}
.bdel:hover{color:var(--red)}

/* IMPACT */
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}
.ib{background:var(--s2);border-radius:8px;padding:9px;text-align:center}
.in{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;line-height:1;margin-bottom:3px}
.il{font-size:10px;color:var(--muted)}

/* EXPORT */
.exbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;background:linear-gradient(135deg,rgba(34,211,165,.09),rgba(59,130,246,.06));border:1px solid rgba(34,211,165,.2);border-radius:10px;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:13px}
.exbtn:hover{background:linear-gradient(135deg,rgba(34,211,165,.18),rgba(59,130,246,.13));transform:translateY(-1px)}

@media(max-width:620px){
  .two{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr 1fr}
  .rg{grid-template-columns:1fr 1fr}
  .ig{grid-template-columns:1fr 1fr}
  .asb{grid-template-columns:1fr 1fr}
  .lib{grid-template-columns:1fr 1fr}
  .gg{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <span style="font-size:13px;color:var(--muted2)">جاري التحقق من الحساب...</span>
</div>

<div id="authScreen">
  <div class="auth-box">
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="blang" id="authLangBtn" onclick="togLang()">EN</button>
    </div>
    <div class="auth-logo">
      <div class="logo-ico">💹</div>
      <h1>Mustafa Finance</h1>
      <p id="authSubP">لوحة التحكم المالي الشخصية</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab act" id="tabL" onclick="setTab('login')">تسجيل الدخول</button>
      <button class="auth-tab" id="tabS" onclick="setTab('signup')">إنشاء حساب</button>
    </div>
    <div id="authErr" class="auth-err"></div>

      <label>البريد الإلكتروني</label>
      <input class="auth-in" id="emailIn" type="email" placeholder="example@gmail.com">

    <div class="auth-field">
      <label>كلمة المرور (6 أحرف على الأقل)</label>

<div id="appScreen">

    <input class="tb-in" id="newProfIn" placeholder="حساب جديد...">
    <button class="bxs bg" onclick="createProf()">+</button>
    <button class="bxs br" onclick="delProf()">✕</button>
    <div class="u-bar"><div class="u-av" id="uAv">M</div><span id="uEmail"></span></div>
    <button class="blang" id="bLang" onclick="togLang()">EN</button>
    <button class="bout" onclick="doLogout()">خروج</button>
    <span class="sdot" id="sdot"></span>
  </div>
  <div class="main" id="mc"></div>
</div>

// Timeout fallback — if Firebase takes too long show auth screen
var initTimeout = setTimeout(function(){

  document.getElementById('authScreen').style.display='flex';
}, 6000);

auth.onAuthStateChanged(function(user){
  clearTimeout(initTimeout);
  if(user){
    currentUser=user;
    loadData(user.uid).then(function(){
      showApp(user);
    }).catch(function(){
      profiles=JSON.parse(JSON.stringify(DEF));

      showApp(user);
    });

    document.getElementById('loadingScreen').style.display='none';
    document.getElementById('authScreen').style.display='flex';

});

function showApp(user){

// ── AUTH ACTIONS ──────────────────────────────────────────────────
var authMode='login';
function setTab(m){
  authMode=m;
  document.getElementById('tabL').className='auth-tab'+(m==='login'?' act':'');
  document.getElementById('tabS').className='auth-tab'+(m==='signup'?' act':'');
  document.getElementById('nameF').style.display=m==='signup'?'block':'none';
  document.getElementById('authBtn').textContent=m==='login'?'دخول':'إنشاء الحساب';
  document.getElementById('authErr').style.display='none';
}
function showErr(msg){
  var el=document.getElementById('authErr');
  el.textContent=msg; el.style.display='block';
}
function doAuth(){
  var email=document.getElementById('emailIn').value.trim();
  var pass=document.getElementById('passIn').value;
  var name=document.getElementById('nameIn').value.trim();
  if(!email||!pass){showErr('أدخل البريد الإلكتروني وكلمة المرور');return;}
  if(pass.length<6){showErr('كلمة المرور 6 أحرف على الأقل');return;}
  var btn=document.getElementById('authBtn');
  btn.disabled=true; btn.textContent='جاري...';
  document.getElementById('authErr').style.display='none';
  var p=authMode==='login'?
    auth.signInWithEmailAndPassword(email,pass):
    auth.createUserWithEmailAndPassword(email,pass).then(function(c){
      if(name) return c.user.updateProfile({displayName:name}).then(function(){return c;});
      return c;
    });
  p.catch(function(e){
    btn.disabled=false;
    btn.textContent=authMode==='login'?'دخول':'إنشاء الحساب';
    var msgs={'auth/email-already-in-use':'البريد مستخدم بالفعل',
      'auth/user-not-found':'البريد غير مسجل',
      'auth/wrong-password':'كلمة المرور غير صحيحة',
      'auth/invalid-email':'بريد إلكتروني غير صالح',
      'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة',
      'auth/too-many-requests':'محاولات كثيرة، انتظر قليلاً'};
    showErr(msgs[e.code]||e.message);
  });
}

// ── FIRESTORE ─────────────────────────────────────────────────────
function loadData(uid){
  return db.collection('users').doc(uid).get().then(function(snap){
    if(snap.exists){
      var d=snap.data();
      profiles=d.profiles||JSON.parse(JSON.stringify(DEF));
      current=d.current||'main';
    } else {
      profiles=JSON.parse(JSON.stringify(DEF));
      current='main';
      return saveNow(uid);
    }
  });
}
function saveNow(uid){
  var id=uid||(currentUser&&currentUser.uid);
  if(!id) return Promise.resolve();
  return db.collection('users').doc(id).set({profiles:profiles,current:current,updatedAt:Date.now()});
}
function save(){
  clearTimeout(saveTimer);
  var dot=document.getElementById('sdot');
  if(dot) dot.className='sdot on';
  saveTimer=setTimeout(function(){
    saveNow().then(function(){
      var d=document.getElementById('sdot');
      if(d) d.className='sdot';
    }).catch(function(e){console.error('save:',e);});
  },800);
}

// ── CALC ──────────────────────────────────────────────────────────
function calc(p){
  var gross=0,active=0;
  (p.sources||[]).forEach(function(s){if(s.active){gross+=+s.amount;active++;}});
  var net=gross-(+p.fixedExp||0);
  var goal=+p.goalValue||0;
  var months=net>0?Math.ceil(goal/net):0;
  var years=Math.floor(months/12),mrem=months%12;
  var totRec=0;(p.received||[]).forEach(function(r){totRec+=+r.amount;});
  var totExp=0;(p.expenses||[]).forEach(function(e){totExp+=+e.amount;});
  var netBal=(+p.currentBalance||0)+totRec-totExp;
  var dDelay=net>0?Math.round(totExp/(net/30)):0;
  var pct=goal>0?Math.min((net*12/goal)*100,100):0;
  var srcPct=p.sources.length>0?(active/p.sources.length*100):0;
  var projYear=net>0?(new Date().getFullYear()+Math.ceil(months/12)):'—';
  return{gross,net,months,years,mrem,active,totRec,totExp,netBal,dDelay,pct,srcPct,projYear};
}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fm(n){return Math.round(n).toLocaleString('en-US');}
function td(){var d=new Date();return d.getDate()+'/'+(d.getMonth()+1);}

function setFixExp(v){profiles[current].fixedExp=parseInt(v)||0;save();render();}
function setCurBal(v){profiles[current].currentBalance=parseFloat(v)||0;save();render();}
function togSrc(i,v){profiles[current].sources[i].active=v;save();render();}
function setSrcName(i,v){profiles[current].sources[i].name=v;save();}
function setSrcAmt(i,v){profiles[current].sources[i].amount=parseInt(v)||0;save();render();}
function delSrc(i){profiles[current].sources.splice(i,1);save();render();}
function cycleIcon(i){
  var s=profiles[current].sources[i];

function addRec(){

  document.getElementById('rAmt').value='';
  save();render();
}
function delRec(i){profiles[current].received.splice(i,1);save();render();}

function addExp(){

function exportXL(){
  var wb=XLSX.utils.book_new();
  Object.keys(profiles).forEach(function(k){
    var p=profiles[k],c=calc(p);
    var rows=[['Mustafa Finance — '+p.name],[],
      [t('goalSec'),p.goalName,'',t('goalVl'),p.goalValue],
      [t('mo'),c.months,t('yr'),c.years,'',t('tgYr'),c.projYear],[],
      [t('incSec'),'','',t('cAmt')]
    ];
    p.sources.forEach(function(s){rows.push([s.icon+' '+s.name,s.active?'ON':'OFF','',s.active?s.amount:0]);});
    rows.push([],[t('totInc'),'','',c.gross],[t('fixExp'),'',-p.fixedExp],[t('netLbl'),'','',c.net],[t('aNet')+' ×12','','',c.net*12]);
    rows.push([],[t('balSec')],[t('curBal'),'','',p.currentBalance||0],[t('totRec'),'','',c.totRec],[t('totExp'),'',-c.totExp],[t('netBal'),'','',c.netBal]);
    if((p.received||[]).length>0){rows.push([],[t('recSec')]);p.received.forEach(function(r){rows.push([r.desc,r.type,'',r.amount]);});}
    if((p.expenses||[]).length>0){rows.push([],[t('expSec')]);p.expenses.forEach(function(e){rows.push([e.desc,e.date,'',-e.amount]);});}
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:32},{wch:12},{wch:6},{wch:16}];
    XLSX.utils.book_append_sheet(wb,ws,p.name.substring(0,31).replace(/[\[\]*?:\/\\]/g,''));
  });
  XLSX.writeFile(wb,'mustafa_finance_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
