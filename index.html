<!DOCTYPE html>
<html lang="ar" dir="rtl" id="R">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mustafa Finance</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090f;--c1:#0e1420;--c2:#161e2e;--c3:#1c2740;--br:rgba(255,255,255,.07);--br2:rgba(255,255,255,.13);--ac:#22d3a5;--bl:#3b82f6;--yw:#f59e0b;--rd:#ef4444;--gn:#22c55e;--pr:#a855f7;--tx:#f1f5f9;--mu:#64748b;--m2:#94a3b8}
body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace!important}
/* AUTH */
#A{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(34,211,165,.06) 0%,transparent 60%)}
.abox{background:var(--c1);border:1px solid var(--br2);border-radius:18px;padding:36px 30px;width:100%;max-width:400px}
.atop{display:flex;justify-content:flex-end;margin-bottom:10px}
.alogo{text-align:center;margin-bottom:22px}
.alogo h1{font-size:20px;font-weight:700;color:var(--ac)}
.alogo p{font-size:12px;color:var(--m2);margin-top:3px}
.atabs{display:flex;background:var(--c2);border-radius:9px;padding:3px;margin-bottom:20px;gap:3px}
.atab{flex:1;padding:9px;border-radius:7px;border:none;background:transparent;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
.atab.on{background:var(--c3);color:var(--tx);border:1px solid var(--br2)}
.afield{margin-bottom:12px}
.afield label{font-size:11px;color:var(--m2);display:block;margin-bottom:5px}
.ain{width:100%;background:var(--c2);border:1px solid var(--br);border-radius:8px;padding:10px 13px;color:var(--tx);font-size:14px;outline:none;transition:.2s;direction:ltr;font-family:inherit}
.ain:focus{border-color:var(--ac)}
.abtn{width:100%;padding:12px;border-radius:9px;border:none;background:linear-gradient(135deg,#22d3a5,#1aa880);color:#000;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:.2s;font-family:inherit}
.abtn:hover{opacity:.9}
.abtn:disabled{opacity:.5;cursor:not-allowed}
.aerr{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--rd);margin-bottom:10px;display:none}
.anote{display:flex;align-items:center;gap:6px;background:rgba(34,211,165,.04);border-radius:7px;padding:8px 11px;margin-top:12px}
.anote span{font-size:11px;color:var(--mu)}
/* APP */
#P{display:none}
.topbar{background:var(--c1);border-bottom:1px solid var(--br);padding:9px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.brand{font-size:14px;font-weight:700;color:var(--ac);white-space:nowrap}
.tsel{background:var(--c2);border:1px solid var(--br2);border-radius:7px;color:var(--tx);padding:6px 9px;font-size:12px;outline:none;cursor:pointer;min-width:120px;flex:1;font-family:inherit}
.tin{background:var(--c2);border:1px solid var(--br);border-radius:7px;padding:6px 9px;color:var(--tx);font-size:12px;outline:none;width:120px;font-family:inherit}
.tin:focus{border-color:var(--ac)}
.xs{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s;white-space:nowrap;font-family:inherit}
.xg{background:rgba(34,211,165,.14);color:var(--ac);border:1px solid rgba(34,211,165,.28)}
.xg:hover{background:rgba(34,211,165,.26)}
.xr{background:rgba(239,68,68,.11);color:var(--rd);border:1px solid rgba(239,68,68,.24)}
.xr:hover{background:rgba(239,68,68,.24)}
.xlang{background:var(--c3);color:var(--m2);border:1px solid var(--br2);padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.xlang:hover{color:var(--tx);border-color:var(--ac)}
.xout{background:rgba(239,68,68,.09);color:var(--rd);border:1px solid rgba(239,68,68,.18);padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--ac);opacity:0;transition:.3s}
.sdot.on{opacity:1}
.ubar{display:flex;align-items:center;gap:6px;background:var(--c2);border:1px solid var(--br);border-radius:7px;padding:5px 10px;font-size:11px;color:var(--m2)}
.uav{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--bl));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000}
/* TABS */
.tnav{display:flex;background:var(--c1);border-bottom:1px solid var(--br);padding:0 14px;overflow-x:auto;position:sticky;top:52px;z-index:99}
.tnav::-webkit-scrollbar{display:none}
.tbtn{padding:11px 15px;font-size:12px;font-weight:600;color:var(--mu);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.2s;font-family:inherit}
.tbtn.on{color:var(--ac);border-bottom-color:var(--ac)}
.tpage{display:none}
.tpage.on{display:block}
/* MAIN */
.main{padding:14px;max-width:960px;margin:0 auto}
.card{background:var(--c1);border:1px solid var(--br);border-radius:13px;padding:16px;margin-bottom:12px;animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.sh{font-size:10px;font-weight:600;letter-spacing:.9px;color:var(--mu);margin-bottom:12px;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.sb{width:3px;height:12px;border-radius:2px;flex-shrink:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* HERO */
.hero{background:linear-gradient(135deg,rgba(34,211,165,.09),rgba(59,130,246,.06));border:1px solid rgba(34,211,165,.16);border-radius:13px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;animation:fu .25s ease}
.hi{text-align:center}
.hn{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;line-height:1;margin-bottom:3px}
.hl{font-size:10px;color:var(--m2)}
/* INPUTS */
.ef{background:var(--c2);border:1px solid var(--br);border-radius:6px;padding:6px 9px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;outline:none;direction:ltr;text-align:center;transition:.2s;font-size:13px}
.ef:focus{border-color:var(--ac)}
.efn{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif!important;direction:rtl;text-align:right;font-size:13px;font-weight:500}
.efsm{width:86px}
/* GOAL */
.gg{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.gl{font-size:11px;color:var(--m2);white-space:nowrap}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rb{background:var(--c2);border-radius:9px;padding:11px;text-align:center}
.rn{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;line-height:1;margin-bottom:3px}
.ru{font-size:10px;color:var(--mu)}
/* STATUS */
.st{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:18px;font-size:12px;font-weight:600;margin-bottom:10px;justify-content:center}
.sf{background:rgba(34,211,165,.09);color:var(--ac);border:1px solid rgba(34,211,165,.18)}
.sm{background:rgba(245,158,11,.09);color:var(--yw);border:1px solid rgba(245,158,11,.18)}
.ss{background:rgba(239,68,68,.09);color:var(--rd);border:1px solid rgba(239,68,68,.18)}
.sd{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.spl{background:linear-gradient(135deg,rgba(34,211,165,.07),rgba(59,130,246,.04));border:1px solid rgba(34,211,165,.14);border-radius:9px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center}
/* ANN */
.ar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.ab{background:var(--c2);border-radius:7px;padding:9px;text-align:center}
.an{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.al{font-size:10px;color:var(--mu);margin-top:2px}
/* PROG */
.pg{margin:7px 0}
.pt{display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-bottom:4px}
.pk{height:4px;background:var(--c2);border-radius:2px;overflow:hidden}
.pf{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ac),var(--bl));transition:width .5s}
/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;color:var(--mu);padding:0 7px 8px;text-align:right;border-bottom:1px solid var(--br);letter-spacing:.5px}
.tbl td{padding:7px;border-bottom:1px solid var(--br);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.sw{display:flex;align-items:center;gap:6px}
.sib{background:var(--c2);border:1px solid var(--br);border-radius:5px;padding:3px 7px;font-size:13px;cursor:pointer}
.sib:hover{border-color:var(--ac)}
/* TOGGLE */
.tgl{position:relative;width:40px;height:22px;display:block;flex-shrink:0}
.tgl input{opacity:0;position:absolute;width:100%;height:100%;cursor:pointer;margin:0;z-index:2}
.tsl{position:absolute;inset:0;background:var(--c3);border:1px solid var(--br);border-radius:11px;pointer-events:none;transition:.2s}
.tsl::before{content:'';position:absolute;width:16px;height:16px;right:3px;top:2px;background:var(--mu);border-radius:50%;transition:.25s}
.tgl input:checked~.tsl{background:rgba(34,211,165,.18);border-color:var(--ac)}
.tgl input:checked~.tsl::before{transform:translateX(-18px);background:var(--ac)}
/* TOTALS */
.tot{background:var(--c2);border-radius:9px;padding:11px 13px;margin-top:10px}
.tr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
.tl{color:var(--m2)}
.tv{font-family:'JetBrains Mono',monospace;font-weight:600}
.trn{border-top:1px solid var(--br);margin-top:6px;padding-top:8px}
.trn .tv{color:var(--ac);font-size:17px}
/* ADD SRC */
.asb{display:grid;grid-template-columns:auto 1fr 80px auto auto;gap:7px;align-items:center;padding:9px;background:var(--c2);border-radius:8px;margin-top:10px}
/* LOG */
.lib{display:flex;gap:7px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.li{background:var(--c2);border:1px solid var(--br);border-radius:7px;padding:7px 9px;color:var(--tx);font-size:13px;outline:none;flex:1;min-width:100px;font-family:inherit}
.li:focus{border-color:var(--ac)}
.la{background:var(--c2);border:1px solid var(--br);border-radius:7px;padding:7px 9px;color:var(--ac);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;outline:none;text-align:center;direction:ltr;width:100px}
.la:focus{border-color:var(--ac)}
.ltp{background:var(--c2);border:1px solid var(--br);border-radius:7px;padding:7px 9px;color:var(--tx);font-size:12px;outline:none;cursor:pointer;font-family:inherit}
.badd{background:rgba(34,211,165,.14);color:var(--ac);border:1px solid rgba(34,211,165,.28);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;font-family:inherit}
.badd:hover{background:rgba(34,211,165,.26)}
.baddr{background:rgba(239,68,68,.11);color:var(--rd);border:1px solid rgba(239,68,68,.24)}
.ll{max-height:190px;overflow-y:auto}
.lrow{display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--br);font-size:12px}
.lrow:last-child{border-bottom:none}
.ld{flex:1;color:var(--m2)}
.ltag{font-size:10px;padding:2px 7px;border-radius:9px;font-weight:600;white-space:nowrap}
.tgf{background:rgba(34,211,165,.11);color:var(--ac)}
.tgl2{background:rgba(239,68,68,.11);color:var(--rd)}
.tgo{background:rgba(100,116,139,.14);color:var(--m2)}
.tge{background:rgba(245,158,11,.11);color:var(--yw)}
.lv{font-family:'JetBrains Mono',monospace;font-weight:600;white-space:nowrap}
.ldt{color:var(--mu);font-size:10px;white-space:nowrap}
.bdl{background:none;border:none;color:var(--mu);cursor:pointer;font-size:13px;padding:1px 4px;transition:.15s}
.bdl:hover{color:var(--rd)}
/* MONTHLY */
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.ms{background:var(--c2);border-radius:7px;padding:10px;text-align:center}
.msn{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;line-height:1;margin-bottom:3px}
.msl{font-size:10px;color:var(--mu)}
.mform{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:var(--c2);border-radius:8px;padding:9px;margin-bottom:11px}
.mcol{display:flex;align-items:center;gap:7px;padding:8px 9px;border-bottom:1px solid var(--br)}
.mcol:last-child{border-bottom:none}
.mcleft{flex:1}
.mcbadge{display:inline-flex;align-items:center;background:rgba(168,85,247,.11);color:var(--pr);border:1px solid rgba(168,85,247,.22);border-radius:11px;padding:2px 9px;font-size:11px;font-weight:600;margin-bottom:3px}
.mcsrc{font-size:13px;font-weight:500}
.mcnote{font-size:11px;color:var(--mu);margin-top:1px}
.mcright{text-align:right}
.mcamt{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--gn)}
.mcpct{font-size:10px;color:var(--mu);margin-top:2px}
/* IMPACT */
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.ib{background:var(--c2);border-radius:7px;padding:9px;text-align:center}
.in{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;line-height:1;margin-bottom:3px}
.il{font-size:10px;color:var(--mu)}
/* EXPORT */
.exbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px;background:linear-gradient(135deg,rgba(34,211,165,.09),rgba(59,130,246,.06));border:1px solid rgba(34,211,165,.2);border-radius:9px;color:var(--ac);font-size:14px;font-weight:600;cursor:pointer;transition:.2s;margin-top:12px;font-family:inherit}
.exbtn:hover{background:linear-gradient(135deg,rgba(34,211,165,.18),rgba(59,130,246,.13))}
@media(max-width:620px){.two{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr}.rg{grid-template-columns:1fr 1fr}.ig{grid-template-columns:1fr 1fr}.asb{grid-template-columns:1fr 1fr}.gg{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- AUTH SCREEN — shown by default -->
<div id="A">
<div class="abox">
  <div class="atop">
    <button class="xlang" id="btnALang" onclick="togLang()">EN</button>
  </div>
  <div class="alogo">
    <div style="font-size:36px;margin-bottom:7px">💹</div>
    <h1>Mustafa Finance</h1>
    <p id="aSubP">لوحة التحكم المالي الشخصية</p>
  </div>
  <div class="atabs">
    <button class="atab on" id="tabLogin" onclick="setTab('login')">تسجيل الدخول</button>
    <button class="atab" id="tabSignup" onclick="setTab('signup')">إنشاء حساب</button>
  </div>
  <div class="aerr" id="aErr"></div>
  <div class="afield" id="nameField" style="display:none">
    <label id="nameLbl">الاسم الكامل</label>
    <input class="ain" id="nameIn" type="text" placeholder="مصطفى معتصم">
  </div>
  <div class="afield">
    <label id="emailLbl">البريد الإلكتروني</label>
    <input class="ain" id="emailIn" type="email" placeholder="example@gmail.com">
  </div>
  <div class="afield">
    <label id="passLbl">كلمة المرور</label>
    <input class="ain" id="passIn" type="password" placeholder="••••••••">
  </div>
  <button class="abtn" id="authBtn" onclick="doAuth()">دخول</button>
  <div class="anote"><span>🔒</span><span id="aNoteT">بياناتك محفوظة على Firebase — لا أحد يراها غيرك</span></div>
</div>
</div>

<!-- APP SCREEN -->
<div id="P">
  <div class="topbar">
    <div class="brand">💹 Mustafa Finance</div>
    <select id="profSel" class="tsel" onchange="switchProf(this.value)"></select>
    <input class="tin" id="newProfIn" placeholder="حساب جديد...">
    <button class="xs xg" onclick="createProf()">+</button>
    <button class="xs xr" onclick="delProf()">✕</button>
    <div class="ubar"><div class="uav" id="uAv">M</div><span id="uEmail" style="max-width:120px;overflow:hidden;text-overflow:ellipsis"></span></div>
    <button class="xlang" id="btnLang" onclick="togLang()">EN</button>
    <button class="xout" onclick="doLogout()">خروج</button>
    <span class="sdot" id="sdot"></span>
  </div>
  <div class="tnav">
    <button class="tbtn on" id="t0" onclick="goTab(0)">نظرة عامة</button>
    <button class="tbtn" id="t1" onclick="goTab(1)">مصادر الدخل</button>
    <button class="tbtn" id="t2" onclick="goTab(2)">التحصيل الشهري</button>
    <button class="tbtn" id="t3" onclick="goTab(3)">الرصيد والمصاريف</button>
  </div>
  <div class="main">
    <div class="tpage on" id="pg0"></div>
    <div class="tpage" id="pg1"></div>
    <div class="tpage" id="pg2"></div>
    <div class="tpage" id="pg3"></div>
    <button class="exbtn" onclick="exportXL()">📊 تصدير البيانات إلى Excel</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

firebase.initializeApp({

var lang=localStorage.getItem('mf_lang')||'ar';
var TX={
  ar:{login:"تسجيل الدخول",signup:"إنشاء حساب",loginBtn:"دخول",signupBtn:"إنشاء الحساب",

    goalSec:"الهدف الاستثماري",goalNm:"اسم الهدف",goalVl:"القيمة (ر.ق)",
    mo:"شهراً",yr:"سنة",tgYr:"سنة التحقق",

    totInc:"إجمالي الدخل",fixExp:"المصاريف الثابتة",netLbl:"صافي الوفر ←",
    balSec:"الرصيد والأموال",curBal:"الرصيد الحالي",
    totRec:"واردات",totExp:"مصاريف",netBal:"الصافي",dDelay:"أيام تأخير",
    recSec:"سجل الأموال الواردة",recPh:"هدية، قرض...",amtPh:"المبلغ",

// ── CALC ─────────────────────────────────────────────────────────
function calc(p){
  var gross=0,active=0;
  (p.sources||[]).forEach(function(s){if(s.active){gross+=+s.amount;active++;}});
  var net=gross-(+p.fixedExp||0);
  var goal=+p.goalValue||0;
  var months=net>0?Math.ceil(goal/net):0;
  var years=Math.floor(months/12),mrem=months%12;
  var totRec=0;(p.received||[]).forEach(function(r){totRec+=+r.amount;});
  var totExp=0;(p.expenses||[]).forEach(function(e){totExp+=+e.amount;});
  var totCol=0;(p.collections||[]).forEach(function(c){totCol+=+c.amount;});
  var netBal=(+p.currentBalance||0)+totRec-totExp;
  var dDelay=net>0?Math.round(totExp/(net/30)):0;
  var pct=goal>0?Math.min((net*12/goal)*100,100):0;
  var srcPct=p.sources.length>0?(active/p.sources.length*100):0;
  var projYear=net>0?(new Date().getFullYear()+Math.ceil(months/12)):'—';
  return{gross,net,months,years,mrem,active,totRec,totExp,totCol,netBal,dDelay,pct,srcPct,projYear};
}

function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    '<div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="xs xr" onclick="clrCol()">'+t('clrBtn')+'</button></div>'+
  '</div>';
}

function renderBalance(p,c){
  var rList=(p.received||[]).length===0?noIt():(p.received||[]).map(function(r,i){
    var cl=r.type==='gift'?'tgf':r.type==='loan'?'tgl2':'tgo';
    var tl=r.type==='gift'?t('tGift'):r.type==='loan'?t('tLoan'):t('tOth');
    return'<div class="lrow"><span class="ld">'+es(r.desc)+'</span><span class="ltag '+cl+'">'+tl+'</span><span class="lv" style="color:var(--gn)">+'+fm(r.amount)+'</span><span class="ldt">'+r.date+'</span><button class="bdl" onclick="delRec('+i+')">✕</button></div>';
  }).join('');
  var eList=(p.expenses||[]).length===0?noIt():(p.expenses||[]).map(function(e,i){
    return'<div class="lrow"><span class="ld">'+es(e.desc)+'</span><span class="ltag tge">↓</span><span class="lv" style="color:var(--yw)">-'+fm(e.amount)+'</span><span class="ldt">'+e.date+'</span><button class="bdl" onclick="delExp('+i+')">✕</button></div>';
  }).join('');
  document.getElementById('pg3').innerHTML=
  '<div class="card">'+
    '<div class="sh"><span class="sb" style="background:var(--gn)"></span>'+t('balSec')+'</div>'+
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap">'+
      '<span style="font-size:12px;color:var(--m2)">'+t('curBal')+'</span>'+
      '<input class="ef" type="number" value="'+(p.currentBalance||0)+'" style="width:140px" onblur="setCurBal(this.value)" onkeydown="if(event.key===\'Enter\')this.blur()">'+
    '</div>'+
    '<div class="sh" style="margin-bottom:9px"><span class="sb" style="background:var(--gn)"></span>'+t('recSec')+'</div>'+
    '<div class="lib">'+
      '<input class="li" id="rDesc" placeholder="'+t('recPh')+'">'+
      '<input class="la" id="rAmt" type="number" placeholder="'+t('amtPh')+'" style="width:90px">'+
      '<select class="ltp" id="rType"><option value="gift">'+t('tGift')+'</option><option value="loan">'+t('tLoan')+'</option><option value="other">'+t('tOth')+'</option></select>'+
      '<button class="badd" onclick="addRec()">'+t('addBtn')+'</button>'+
    '</div>'+
    '<div class="ll">'+rList+'</div>'+
    '<div style="display:flex;justify-content:flex-end;margin-top:7px"><button class="xs xr" onclick="clrRec()">'+t('clrBtn')+'</button></div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="sh"><span class="sb" style="background:var(--yw)"></span>'+t('expSec')+'</div>'+
    '<div class="lib">'+
      '<input class="li" id="eDesc" placeholder="'+t('expPh')+'">'+
      '<input class="la" id="eAmt" type="number" placeholder="'+t('amtPh')+'" style="width:90px;color:var(--yw)">'+
      '<button class="badd baddr" onclick="addExp()">'+t('addBtn')+'</button>'+
    '</div>'+
    '<div class="ll">'+eList+'</div>'+
    '<div style="display:flex;justify-content:flex-end;margin-top:7px"><button class="xs xr" onclick="clrExp()">'+t('clrBtn')+'</button></div>'+
  '</div>';
}

// ── ACTIONS ──────────────────────────────────────────────────────
function setGoalName(v){profiles[current].goalName=v;save();}
function setGoalVal(v){profiles[current].goalValue=parseInt(v)||0;save();renderTab(0);}
function setFixExp(v){profiles[current].fixedExp=parseInt(v)||0;save();renderTab(1);}
function setCurBal(v){profiles[current].currentBalance=parseFloat(v)||0;save();}
function togSrc(i,v){profiles[current].sources[i].active=v;save();renderTab(1);}
function setSrcName(i,v){profiles[current].sources[i].name=v;save();}
function setSrcAmt(i,v){profiles[current].sources[i].amount=parseInt(v)||0;save();renderTab(1);}
function delSrc(i){profiles[current].sources.splice(i,1);save();renderTab(1);}
function cycleIcon(i){var s=profiles[current].sources[i];s.icon=ICONS[(ICONS.indexOf(s.icon)+1)%ICONS.length];save();renderTab(1);}
function addSrc(){
  var n=document.getElementById('nSrcN').value.trim();
  var a=parseInt(document.getElementById('nSrcA').value)||1000;
  var ic=document.getElementById('nSrcI').value;
  if(!n)return;
  profiles[current].sources.push({name:n,icon:ic,active:true,amount:a});
  save();renderTab(1);
}
function fillMthAmt(){
  var sn=document.getElementById('mSrc').value; if(!sn)return;
  var src=(profiles[current].sources||[]).find(function(s){return s.name===sn;});
  if(src){var el=document.getElementById('mAmt');if(el)el.value=src.amount;}
}
function addCol(){
  var src=document.getElementById('mSrc').value;
  var amt=parseFloat(document.getElementById('mAmt').value);
  var mon=parseInt(document.getElementById('mMon').value);
  var note=document.getElementById('mNote').value.trim();
  if(!src||!amt||amt<=0)return;
  var now=new Date();
  if(!profiles[current].collections)profiles[current].collections=[];
  profiles[current].collections.push({source:src,amount:amt,month:mon,year:now.getFullYear(),note:note,date:mon+'/'+now.getFullYear()});
  profiles[current].currentBalance=(+profiles[current].currentBalance||0)+amt;
  document.getElementById('mAmt').value='';document.getElementById('mNote').value='';
  save();renderTab(2);
}
function delCol(i){
  var x=profiles[current].collections[i];
  profiles[current].currentBalance=Math.max(0,(+profiles[current].currentBalance||0)-(+x.amount||0));
  profiles[current].collections.splice(i,1);save();renderTab(2);
}
function clrCol(){if(!confirm(t('confClr')))return;var tot=0;(profiles[current].collections||[]).forEach(function(x){tot+=+x.amount;});profiles[current].currentBalance=Math.max(0,(+profiles[current].currentBalance||0)-tot);profiles[current].collections=[];save();renderTab(2);}
function addRec(){
  var d=document.getElementById('rDesc').value.trim()||'مبلغ';
  var a=parseFloat(document.getElementById('rAmt').value); if(!a||a<=0)return;
  var tp=document.getElementById('rType').value;
  profiles[current].received.push({desc:d,amount:a,type:tp,date:td()});
  document.getElementById('rDesc').value='';document.getElementById('rAmt').value='';
  save();renderTab(3);
}
function delRec(i){profiles[current].received.splice(i,1);save();renderTab(3);}
function clrRec(){if(confirm(t('confClr'))){profiles[current].received=[];save();renderTab(3);}}
function addExp(){
  var d=document.getElementById('eDesc').value.trim()||'مصروف';
  var a=parseFloat(document.getElementById('eAmt').value); if(!a||a<=0)return;
  profiles[current].expenses.push({desc:d,amount:a,date:td()});
  document.getElementById('eDesc').value='';document.getElementById('eAmt').value='';
  save();renderTab(3);
}
function delExp(i){profiles[current].expenses.splice(i,1);save();renderTab(3);}
function clrExp(){if(confirm(t('confClr'))){profiles[current].expenses=[];save();renderTab(3);}}

// ── EXCEL ────────────────────────────────────────────────────────
function exportXL(){
  var wb=XLSX.utils.book_new();
  Object.keys(profiles).forEach(function(k){
    var p=profiles[k],c=calc(p);
    var rows=[['Mustafa Finance — '+p.name],[],
      ['الهدف',p.goalName,'',t('goalVl'),p.goalValue],
      [t('mo'),c.months,t('yr'),c.years,'',t('tgYr'),c.projYear],[],
      [t('incSec'),'','',t('cAmt')]];
    p.sources.forEach(function(s){rows.push([s.icon+' '+s.name,s.active?'ON':'OFF','',s.active?s.amount:0]);});
    rows.push([],[t('totInc'),'','',c.gross],[t('fixExp'),'',-p.fixedExp],[t('netLbl'),'','',c.net],['وفر سنوي','','',c.net*12]);
    rows.push([],[t('balSec')],[t('curBal'),'','',p.currentBalance||0],[t('totRec'),'','',c.totRec],[t('totExp'),'',-c.totExp],[t('netBal'),'','',c.netBal]);
    if((p.collections||[]).length>0){rows.push([],[t('mthSec')]);p.collections.forEach(function(x){rows.push([x.source,x.month+' — '+mname(x.month)+' '+x.year,x.note||'',x.amount]);});}
    if((p.received||[]).length>0){rows.push([],[t('recSec')]);p.received.forEach(function(r){rows.push([r.desc,r.type,'',r.amount]);});}
    if((p.expenses||[]).length>0){rows.push([],[t('expSec')]);p.expenses.forEach(function(e){rows.push([e.desc,e.date,'',-e.amount]);});}
    var ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:32},{wch:12},{wch:6},{wch:16}];
    XLSX.utils.book_append_sheet(wb,ws,p.name.substring(0,31).replace(/[\[\]*?:\/\\]/g,''));
  });
  XLSX.writeFile(wb,'mustafa_finance_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// ── INIT ─────────────────────────────────────────────────────────
applyLang();
</script>
